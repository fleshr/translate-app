name: "Setup environment"
description: "Install pnpm, node and dependencies. Build dictionaries."

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 11

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: lts/*
        cache: "pnpm"

    - name: Install dependencies
      run: pnpm install
      shell: bash

    - name: Build dictionaries
      run: pnpm intlayer build
      shell: bash
